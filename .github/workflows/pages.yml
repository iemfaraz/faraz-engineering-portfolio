name: Publish portfolio to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['pages-site/**', 'independent/**', '.github/workflows/pages.yml', 'portfolio-data.json', 'uploads/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pages-site/package-lock.json
      - run: npm ci
        working-directory: pages-site
      - run: npm run build
        working-directory: pages-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
